[table.pool_manager__swap]
description = "A swap against one pool. The busiest table in this nest by a wide margin."
grain = "one row per swap"

[table.pool_manager__swap.columns]
amount0 = "SIGNED from the pool's perspective: negative = the pool paid out, positive = took in. The two amounts always have opposite signs, so summing them nets to ~zero — use abs() for volume."
amount1 = "See amount0. Signed, pool's perspective."
fee = "The fee actually charged on THIS swap. For dynamic-fee pools this is the real value; the pool's static `fee` is only a flag."
id = "The `id` bytes32 parameter. (seeded from the ABI - edit semantic.toml to improve this)"
liquidity = "Active in-range liquidity after the swap."
sender = "The `sender` address parameter. (seeded from the ABI - edit semantic.toml to improve this)"
sqrtPriceX96 = "Pool price after the swap, as sqrt(price) × 2^96. Converting to a human ratio needs both tokens' decimals — a client-side join, not something this nest can do."
tick = "The pool's tick after the swap."

[table.pool_manager__swap.footguns]
big_ints = [
    "amount0",
    "amount1",
    "sqrtPriceX96",
    "liquidity",
]
overflows_dec = ["sqrtPriceX96"]

[table.pool_manager__transfer]
description = "ERC-6909 claim-token movement. V4 lets you hold a balance inside the PoolManager instead of settling to ERC-20 every time — this is that ledger, NOT pool-token transfers."
