[view.hook]
description = "Per-hook adoption: how many pools each hook contract backs. This view has no V3 equivalent."

[view.hook_adoption]
description = "The headline split — what fraction of V4 pools use a hook at all."

[view.pool]
description = "Pool entity with its immutable key, plus derived has_hook and fee_is_dynamic flags."

[view.pool_activity]
description = "Per-pool swap counts and absolute volume, joined to the pool key. Volume uses abs() because raw amounts are signed."

[view.pool_liquidity]
description = "Per-pool liquidity provision: net delta, added, removed, and distinct providers."
