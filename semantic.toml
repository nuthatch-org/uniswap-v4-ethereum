[table.pool_manager__protocol_fee_controller_updated]
description = "The address allowed to set protocol fees was changed. Governance-level, rare."
grain = "one row per controller change"

[table.pool_manager__protocol_fee_controller_updated.columns]
protocolFeeController = "The `protocolFeeController` address parameter. (seeded from the ABI - edit semantic.toml to improve this)"

[table.pool_manager__protocol_fee_updated]
description = "The protocol's cut for one pool being changed by the fee controller. Distinct from the LP fee that hooks and pool keys control."
grain = "one row per protocol-fee change"

[table.pool_manager__protocol_fee_updated.columns]
id = "The `id` bytes32 parameter. (seeded from the ABI - edit semantic.toml to improve this)"
